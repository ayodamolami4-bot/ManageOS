name: ManageOS live user journey

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-user-journey.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-journey:
    name: Registration, tenancy, work and file smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test production user journey
        shell: bash
        env:
          LIVE_BASE_URL: https://manageos.onrender.com
        run: |
          node <<'NODE'
          const { randomUUID, randomBytes } = require("node:crypto");
          const baseUrl = process.env.LIVE_BASE_URL;
          const suffix = randomUUID().slice(0, 12);
          const password = randomBytes(20).toString("hex") + "Aa!";
          const emailA = `manageos-e2e-${suffix}-a@example.com`;
          const emailB = `manageos-e2e-${suffix}-b@example.com`;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const report = (step, status, detail = "") =>
            console.log(`${step}: HTTP ${status}${detail ? " — " + detail : ""}`);
          function client() {
            const jar = new Map();
            async function request(method, path, body, options = {}) {
              const headers = { Accept: "application/json" };
              if (jar.size) headers.Cookie = [...jar].map(([k, v]) => k + "=" + v).join("; ");
              if (options.csrf !== false && !["GET", "HEAD"].includes(method) && jar.has("csrf_token")) {
                headers["X-CSRF-Token"] = jar.get("csrf_token");
              }
              if (body != null && !options.form) headers["Content-Type"] = "application/json";
              const response = await fetch(baseUrl + path, {
                method,
                headers,
                body: options.form ? body : body == null ? undefined : JSON.stringify(body),
                redirect: "manual",
                signal: AbortSignal.timeout(25000)
              });
              for (const cookie of response.headers.getSetCookie()) {
                const first = cookie.split(";")[0], equals = first.indexOf("=");
                if (equals > 0) jar.set(first.slice(0, equals), first.slice(equals + 1));
              }
              let data;
              if (options.raw) data = await response.text();
              else {
                const text = await response.text();
                try { data = JSON.parse(text); }
                catch { data = { error: { code: "NON_JSON_RESPONSE" } }; }
              }
              return { status: response.status, data, headers: response.headers };
            }
            return { request };
          }
          function expect(result, status, step) {
            report(step, result.status, result.status !== status ? `expected ${status}, code=${result.data?.error?.code || "none"}` : "passed");
            if (result.status !== status) throw new Error(step + " returned unexpected status " + result.status);
            return result.data;
          }
          function must(value, label) {
            if (!value) throw new Error(label + " missing or incorrect");
            return value;
          }
          async function ready() {
            for (let i = 0; i < 15; i++) {
              try {
                const response = await fetch(baseUrl + "/api/ready", { signal: AbortSignal.timeout(20000) });
                const data = await response.json();
                if (response.status === 200 && data?.database === "connected" && data?.storage === "configured") {
                  console.log("Live readiness: passed");
                  return;
                }
                console.log(`Live readiness attempt ${i+1}: HTTP ${response.status}`);
              } catch (error) { console.log(`Readiness retry ${i+1}: ${error.name}`); }
              await sleep(8000);
            }
            throw new Error("Live app did not become ready");
          }
          async function main() {
            await ready();
            const a = client(), b = client();
            expect(await a.request("GET", "/api/auth/me"), 401, "Unauthenticated /me");
            const csrf = expect(await a.request("GET", "/api/auth/csrf"), 200, "CSRF token issue");
            must(csrf.data?.csrfToken, "CSRF response");
            expect(await a.request("POST", "/api/auth/register/company",
              { companyName: "Should fail", firstName: "E2E", lastName: "Invalid", email: emailA, password },
              { csrf: false }), 403, "CSRF enforcement");
            expect(await a.request("POST", "/api/auth/register/company",
              { companyName: "Should fail", firstName: "1234", lastName: "Invalid", email: emailA, password }),
              400, "Person-name validation");

            const regA = expect(await a.request("POST", "/api/auth/register/company",
              { companyName: "ManageOS E2E A " + suffix, firstName: "Test", lastName: "Owner", email: emailA, password }),
              201, "Company A registration");
            const companyA = must(regA.data?.company?.id, "Company A id");
            const loginBad = expect(await a.request("POST", "/api/auth/login",
              { email: emailA, password: "incorrect-test-password" }), 401, "Invalid login");
            const loginA = expect(await a.request("POST", "/api/auth/login", { email: emailA, password }),
              200, "Company A login");
            must(loginA.data?.company_id === companyA, "Owner-company link");
            must(loginA.data?.roles?.some(x => x.name === "OWNER"), "Owner role");
            const meA = expect(await a.request("GET", "/api/auth/me"), 200, "Authenticated /me");
            must(meA.data?.user?.company_id === companyA, "Session company scope");

            const goal = expect(await a.request("POST", "/api/goals", { title: "E2E Goal " + suffix, priority: "HIGH" }),
              201, "Goal creation");
            const goalId = must(goal.data?.id, "Goal id");
            expect(await a.request("GET", "/api/goals/" + goalId), 200, "Goal read");
            const project = expect(await a.request("POST", "/api/projects",
              { name: "E2E Project " + suffix, priority: "HIGH" }), 201, "Project creation");
            const projectId = must(project.data?.id, "Project id");
            expect(await a.request("GET", "/api/projects/" + projectId), 200, "Project read");
            const task = expect(await a.request("POST", "/api/tasks",
              { projectId, title: "E2E Task " + suffix, priority: "MEDIUM" }), 201, "Task creation");
            const taskId = must(task.data?.id, "Task id");
            expect(await a.request("GET", "/api/tasks/" + taskId), 200, "Task read");

            expect(await b.request("GET", "/api/auth/csrf"), 200, "Company B CSRF");
            const regB = expect(await b.request("POST", "/api/auth/register/company",
              { companyName: "ManageOS E2E B " + suffix, firstName: "Second", lastName: "Owner", email: emailB, password }),
              201, "Company B registration");
            must(regB.data?.company?.id !== companyA, "Separate companies");
            expect(await b.request("POST", "/api/auth/login", { email: emailB, password }), 200, "Company B login");
            function expectIsolated(result, step) {
              report(step, result.status, [403, 404].includes(result.status) ? "access denied" : "unexpected response");
              if (![403, 404].includes(result.status)) throw new Error(step + " did not enforce tenant isolation");
            }
            expectIsolated(await b.request("GET", "/api/projects/" + projectId), "Cross-company project read isolation");
            expectIsolated(await b.request("GET", "/api/goals/" + goalId), "Cross-company goal read isolation");
            expectIsolated(await b.request("GET", "/api/tasks/" + taskId), "Cross-company task read isolation");

            const form = new FormData();
            const text = "ManageOS live file upload verification — " + suffix + "\n";
            form.set("resourceType", "PROJECT");
            form.set("resourceId", projectId);
            form.set("file", new Blob([text], { type: "text/plain" }), "manageos-live-check.txt");
            const uploaded = expect(await a.request("POST", "/api/files", form, { form: true }),
              201, "Private Supabase upload");
            const fileId = must(uploaded.data?.id, "Uploaded file id");
            expect(await a.request("GET", "/api/files/" + fileId), 200, "File metadata read");
            const downloaded = expect(await a.request("GET", "/api/files/" + fileId + "/download", null, { raw: true }),
              200, "Private file download");
            must(downloaded === text, "Downloaded bytes match upload");
            expect(await b.request("GET", "/api/files/" + fileId), 404, "Cross-company file isolation");
            expect(await a.request("DELETE", "/api/files/" + fileId), 200, "Private file removal");
            expect(await a.request("GET", "/api/files/" + fileId), 404, "Removed file inaccessible");

            expect(await a.request("POST", "/api/auth/logout"), 200, "Logout");
            expect(await a.request("GET", "/api/auth/me"), 401, "Session revoked after logout");
            console.log("PASS: Live user journey, tenant isolation, storage and authentication.");
            console.log("Test-only companies created (reserved example.com accounts); passwords not logged.");
          }
          main().catch(error => { console.error("LIVE JOURNEY FAILED:", error.message); process.exitCode = 1; });
          NODE
