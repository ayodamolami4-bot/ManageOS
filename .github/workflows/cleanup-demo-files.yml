name: ManageOS demo file deletion cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: "19 5 * * *"

permissions:
  contents: read

concurrency:
  group: manageos-demo-file-cleanup
  cancel-in-progress: false

jobs:
  clean:
    name: Retry private object deletion
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NODE_ENV: production
      FILE_STORAGE_BACKEND: r2
      DATABASE_URL: ${{ secrets.MANAGEOS_DEMO_DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check demo storage configuration
        id: config
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$R2_ACCOUNT_ID" ] &&
             [ -n "$R2_BUCKET" ] && [ -n "$R2_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Demo database or R2 secrets unavailable; skipping cleanup."
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        if: steps.config.outputs.enabled == 'true'
      - name: Retry pending private object removals
        if: steps.config.outputs.enabled == 'true'
        run: node scripts/retryFileDeletions.js
