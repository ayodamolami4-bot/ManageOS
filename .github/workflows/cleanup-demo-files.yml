name: ManageOS demo file deletion cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: "19 5 * * *"

permissions:
  contents: read

concurrency:
  group: manageos-demo-file-cleanup
  cancel-in-progress: false

jobs:
  clean:
    name: Retry private object deletion
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NODE_ENV: production
      FILE_STORAGE_BACKEND: supabase
      DATABASE_URL: ${{ secrets.MANAGEOS_DEMO_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.MANAGEOS_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.MANAGEOS_SUPABASE_SECRET_KEY }}
      SUPABASE_STORAGE_BUCKET: manageos-files
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check demo storage configuration
        id: config
        # Before checkout the backend/ directory does not exist on the runner.
        working-directory: .
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$SUPABASE_URL" ] &&
             [ -n "$SUPABASE_SECRET_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Demo database or Supabase Storage secrets unavailable; skipping cleanup."
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        if: steps.config.outputs.enabled == 'true'
      - name: Retry pending private object removals
        if: steps.config.outputs.enabled == 'true'
        run: node scripts/retryFileDeletions.js
