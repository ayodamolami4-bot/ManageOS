name: Verify private demo R2 storage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Live R2 read-write-delete round trip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_ENV: production
      FILE_STORAGE_BACKEND: r2
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check private storage credentials
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_API_TOKEN" ]; then
            echo "Missing private R2 secrets; no live verification attempted." >&2
            exit 1
          fi
      - name: Verify upload, download, delete and confirmed removal
        run: node backend/scripts/verifyR2.js
