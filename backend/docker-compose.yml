services:
  postgres:
    image: postgres:18.6-alpine
    container_name: manageos-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - manageos_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: manageos-migrate

    environment:
      NODE_ENV: development

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      FRONTEND_URL: ${FRONTEND_URL}

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - node
      - migrate.js

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: manageos-api

    restart: unless-stopped

    environment:
      NODE_ENV: development

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      FRONTEND_URL: ${FRONTEND_URL}

    ports:
      - "5000:5000"

    volumes:
      - manageos_storage:/app/storage

    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  manageos_postgres_data:
  manageos_storage: