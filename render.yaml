# Render Blueprint for a future production/recruiter deployment.
# Does not create a service until explicitly connected/synced in Render.
# One paid web service hosts the React SPA and the Express API at one origin.
services:
  - type: web
    name: manageos
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --prefix backend && npm ci --include=dev --prefix frontend && npm run build --prefix frontend
    preDeployCommand: npm run migrate --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/ready
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
